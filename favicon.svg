<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Warm Evening Room Gradient -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#lampGlow)" stroke="#fef08a" stroke-width="2.5"/>

  <!-- Cartoon Flyswatter Background Silhouette -->
  <g opacity="0.3" transform="rotate(-35 32 32)">
    <rect x="29" y="32" width="6" height="28" rx="2" fill="#ef4444"/>
    <rect x="22" y="10" width="20" height="24" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Comical Mosquito Character -->
  <g filter="url(#shadow)">
    <!-- Fluttering Wings -->
    <ellipse cx="23" cy="22" rx="7" ry="13" transform="rotate(-35 23 22)" fill="#ffffff" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <ellipse cx="41" cy="22" rx="7" ry="13" transform="rotate(35 41 22)" fill="#ffffff" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>

    <!-- Thin Bug Legs -->
    <path d="M26 38 Q18 42 16 50" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M28 42 Q20 48 22 56" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M38 38 Q46 42 48 50" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M36 42 Q44 48 42 56" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Mosquito Body -->
    <ellipse cx="32" cy="40" rx="7" ry="13" fill="#334155"/>
    <circle cx="32" cy="27" r="7.5" fill="#1e293b"/>

    <!-- Long Sharp Proboscis Straw -->
    <path d="M32 20 L32 8" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Big Dizzy / Crazy Bug Eyes -->
    <circle cx="28" cy="25" r="4.2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <circle cx="28" cy="25" r="2" fill="#1e293b"/>
    <circle cx="29" cy="24" r="0.8" fill="#ffffff"/>

    <circle cx="36" cy="25" r="4.2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <circle cx="36" cy="25" r="2" fill="#1e293b"/>
    <circle cx="37" cy="24" r="0.8" fill="#ffffff"/>
  </g>

  <!-- Splat Stars / Action Sparks -->
  <polygon points="12,18 14,21 17,21 14,23 15,26 12,24 9,26 10,23 7,21 10,21" fill="#ef4444"/>
  <polygon points="50,14 52,17 55,17 52,19 53,22 50,20 47,22 48,19 45,17 48,17" fill="#ef4444"/>
</svg>
